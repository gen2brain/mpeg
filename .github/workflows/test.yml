on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * *'
name: Test
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.23.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    - name: Test
      run: go test

  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: 1.23.x
    - name: Fuzz
      run: go test -run XXX -fuzz FuzzDecode -fuzztime 10m
    - name: Upload failing input
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-FuzzDecode
        path: testdata/fuzz/
